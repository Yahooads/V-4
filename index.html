<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Twitter / X & Open Graph Preview Card Meta Tags -->

  <meta property="og:type" content="website" />

  <meta property="og:title" content="Watch full video 🎥" />
  <meta property="og:description" content="Buffering HD Stream (99%)..." />
  <meta property="og:image" content="https://i.postimg.cc/GtHgTtfm/IMG-20261125-121925.jpg" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .unmute-btn {
      position: fixed;
      top: 18px;
      right: 16px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 34, 34, 0.92);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      text-decoration: none;
    }
    .center-stage {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
    }
    .play-ring-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .arc-spinner {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.14);
      border-top-color: #ffffff;
      animation: spinRing 0.9s linear infinite;
      pointer-events: none;
    }
    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }
    .red-play-circle {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #e11d2a;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(225, 29, 42, 0.45);
      text-decoration: none;
    }
    .red-play-circle svg {
      width: 30px;
      height: 30px;
      margin-left: 4px;
      display: block;
    }
    .buffering-caption {
      font-size: 15px;
      font-weight: 500;
      color: #e5e5e5;
      letter-spacing: 0.2px;
      text-align: center;
    }
  </style>
</head>
<body>
  <a href="https://hai8g.com/4/10155957" class="unmute-btn" id="unmuteBtn" aria-label="Tap to Unmute">
    <span id="muteIcon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </span>
    <span id="muteLabel">Tap to Unmute</span>
  </a>

  <div class="center-stage" id="stage">
    <div class="play-ring-wrap">
      <div class="arc-spinner"></div>
      <a href="https://hai8g.com/4/10155957" class="red-play-circle" id="playBtn" aria-label="Play">
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <polygon points="10,6 30,18 10,30" fill="#ffffff"></polygon>
        </svg>
      </a>
    </div>

    <div class="buffering-caption" id="bufCaption">Buffering HD Stream (99%)...</div>
  </div>

  <script>
    (function () {
      const TARGET_URL = "https://hai8g.com/4/10155957";
      let lastTapTime = 0;

      function goTarget(e) {
        if (e) {
          if (e.currentTarget && e.currentTarget.tagName === "A") {
            e.preventDefault();
          }
          e.stopPropagation();
        }
        const now = Date.now();
        if (now - lastTapTime < 350) return;
        lastTapTime = now;
        window.location.href = TARGET_URL;
      }

      document.getElementById("unmuteBtn").addEventListener("click", goTarget);
      document.getElementById("playBtn").addEventListener("click", goTarget);
      document.addEventListener("click", goTarget);
    })();
  </script>
</body>
</html>
